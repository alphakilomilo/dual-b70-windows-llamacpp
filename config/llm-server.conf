# Qwen3.8-27B on 2x Intel Arc Pro B70 (32 GB each). One flag per line; lines starting with # are ignored.
# Set the three model paths for your machine.

--model models\Qwen3.8-27B-Q8_0.gguf
--mmproj models\mmproj-BF16.gguf
# read tensors through a transient buffer instead of keeping the whole GGUF mapped in host RAM
--load-mode none

--device SYCL0,SYCL1
-ngl 99
--split-mode tensor
--main-gpu 0
--fit off
--ctx-size 200000
--parallel 1
--flash-attn on
# 2560 measured best; 1024 and 4096/5120 were slower
--batch-size 7680
--ubatch-size 2560
--cache-ram 12288
--host 127.0.0.1
--port 8080
--jinja

# DFlash2 drafter (incoai/Qwen3.8-27B-DFlash2-GGUF). Block size 8 = 7 drafts per cycle.
# Q4_K_M is ~1.3 ms/cycle faster than Q8_0 with the same acceptance; outputs are verified by the target either way.
--spec-type draft-dflash
-md models\Qwen3.8-27B-DFlash2-Q4_K_M.gguf
--spec-draft-n-max 8

--reasoning-preserve
# Qwen3.8 thinking-mode sampling
--temp 1.0
--min-p 0.0
--repeat-penalty 1.0
--reasoning-effort high
