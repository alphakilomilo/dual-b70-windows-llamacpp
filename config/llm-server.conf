# Qwen3.8-27B on 2x Intel Arc Pro B70 (32 GB each). One flag per line; lines starting with # are ignored.
# Set the three model paths for your machine.

--model models\Qwen3.8-27B-Q8_0.gguf
--mmproj models\mmproj-BF16.gguf
# GPU0 also drives the display; on GPU1 the vision encoder never spills to host memory (~3 s vs ~27 s per screenshot)
--mmproj-device SYCL1
# read tensors through a transient buffer instead of keeping the whole GGUF mapped in host RAM
--load-mode none

--device SYCL0,SYCL1
-ngl 99
--split-mode tensor
--main-gpu 0
--fit off
--ctx-size 200000
--parallel 1
--flash-attn on
# 2560 measured best; 1024 and 4096/5120 were slower
--batch-size 7680
--ubatch-size 2560
--cache-ram 12288
--host 127.0.0.1
--port 8080
--jinja

# Look-up drafting first: when the last 16 tokens appeared earlier in the context, the next 16 are the draft.
# Otherwise the DSpine drafter (block of 16 = 15 drafts) builds a 12-node tree (LLAMA_SPEC_TREE in the launcher).
# DSpine GGUF: convert tencent/Qwen3.8-27B-DSpine-b16 with the patched convert_hf_to_gguf.py, quantize to Q4_K_M,
# then add the 64K-token head with scripts\make_draft_head.py (see docs\dspine.md). Never use the BF16 file.
--spec-type ngram-simple,draft-dflash
--spec-ngram-simple-size-n 16
--spec-ngram-simple-size-m 16
-md models\Qwen3.8-27B-DSpine-b16-Q4_K_M-v64k.gguf
--spec-draft-n-max 16
# drafts are sampled and verified so the output distribution is unchanged at temperature 1.0
--spec-draft-sampling probabilistic

--reasoning-preserve
# Qwen3.8 thinking-mode sampling
--temp 1.0
--min-p 0.0
--repeat-penalty 1.0
--reasoning-effort high
